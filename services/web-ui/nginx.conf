# Serves the built UI and proxies the two backends onto the same origin, so the browser never makes
# a cross-origin call and the client code is identical to the Vite dev setup.
server {
    listen 8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html must not be cached or a redeploy would keep serving
    # the old bundle references.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://${PULSESTREAM_QUERY_HOST}:${PULSESTREAM_QUERY_PORT}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ingest/ {
        proxy_pass http://${PULSESTREAM_INGESTION_HOST}:${PULSESTREAM_INGESTION_PORT}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # query-service mounts its REST API under /api/v1 but Actuator sits at the server root, so it
    # is not reachable through the /api/ location above. This gives the Overview screen's service
    # health matrix a real status to read instead of a hardcoded one.
    location /qactuator/ {
        proxy_pass http://${PULSESTREAM_QUERY_HOST}:${PULSESTREAM_QUERY_PORT}/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus, read-only. The service telemetry on the Overview screen (request rate, latency
    # percentile, JVM and Kafka publish timings) is only available as scraped metrics — the REST
    # APIs cannot answer for it. Only the query API is proxied; the admin surface is not.
    location /prom/api/v1/ {
        proxy_pass http://${PULSESTREAM_PROMETHEUS_HOST}:${PULSESTREAM_PROMETHEUS_PORT}/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
