spring:
  datasource:
    # The read API is backed by Postgres in every real environment; tests run against H2 in
    # PostgreSQL mode so the context can start without an external database. VALUE is de-keyworded
    # because platform.processed_telemetry and platform.anomalies both have a `value` column.
    url: jdbc:h2:mem:query-service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;INIT=CREATE SCHEMA IF NOT EXISTS platform
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
        default_schema: platform
